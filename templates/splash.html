<!DOCTYPE html>
<html lang="uz">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elektrikjan - Yuklanmoqda...</title>

    <!-- TAILWIND & FONT AWESOME -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #090d16;
            overflow: hidden;
            color: #ffffff;
        }

        /* Elementlarning mayin chiqishi */
        @keyframes fadeUp {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* Chiziqli progress bar animatsiyasi */
        @keyframes progress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        .animate-fade-up {
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .progress-fill {
            animation: progress 2.8s linear forwards;
        }
    </style>
</head>

<body class="flex flex-col items-center justify-between h-screen py-12 px-6 antialiased relative">

    <!-- Orqa fon uchun zamonaviy nurli effektlar -->
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-indigo-600/15 rounded-full blur-[90px] pointer-events-none"></div>
    <div class="absolute bottom-1/4 left-1/2 -translate-x-1/2 w-48 h-48 bg-emerald-500/10 rounded-full blur-[80px] pointer-events-none"></div>

    <!-- BOSOSIY LOGO VA MATN -->
    <div class="flex-1 flex flex-col items-center justify-center text-center relative z-10">
        
        <!-- LOGO (Atrofida aylanma porlovchi yuklanish chizig'i bilan) -->
        <div class="relative w-32 h-32 flex items-center justify-center animate-fade-up">
            <!-- Tashqi aylanma spinner -->
            <div class="absolute inset-0 rounded-[36px] border-[2.5px] border-indigo-500/20 border-t-indigo-500 animate-spin" style="animation-duration: 1.5s;"></div>
            
            <!-- Ichki gradient quti va rasm -->
            <div class="w-28 h-28 rounded-[30px] bg-gradient-to-br from-indigo-500 via-indigo-600 to-purple-700 p-0.5 shadow-[0_0_40px_rgba(99,102,241,0.3)]">
                <img class="w-full h-full rounded-[28px] object-cover shadow-inner" 
                     src="{% static 'img/logo.jpg' %}" 
                     alt="Logo"
                     onerror="this.onerror=null; this.src='https://img.icons8.com/fluency/96/lightning-bolt.png';">
            </div>
        </div>

        <!-- BREND NOMI -->
        <h1 class="text-white text-3xl font-black mt-8 tracking-tight animate-fade-up" style="animation-delay: 0.1s;">
            Elektrikjan
        </h1>

        <!-- SUBTITLE -->
        <div class="inline-flex items-center gap-1.5 mt-2.5 px-3 py-1 rounded-full bg-white/5 border border-white/10 backdrop-blur-md animate-fade-up" style="animation-delay: 0.2s;">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
            <span class="text-indigo-300 text-[10px] font-black tracking-[0.25em] uppercase">
                Avto Tizim va Boshqaruv
            </span>
        </div>

    </div>

    <!-- PASTKI YUKLANISH LINIYASI VA VERSIYA -->
    <div class="w-full max-w-[220px] flex flex-col items-center gap-4 relative z-10 animate-fade-up" style="animation-delay: 0.3s;">
        
        <!-- Silliq to'ladigan chiziq -->
        <div class="w-full h-[4px] bg-slate-800/80 rounded-full overflow-hidden p-0.5 border border-slate-700/50">
            <div class="h-full bg-gradient-to-r from-indigo-500 via-purple-500 to-emerald-400 progress-fill rounded-full shadow-[0_0_12px_rgba(99,102,241,0.6)]"></div>
        </div>

        <!-- Kichik xavfsizlik matni -->
        <span class="text-[9px] font-bold text-slate-400 tracking-widest uppercase font-mono flex items-center gap-1.5">
            <i class="fas fa-shield-halved text-[8px] text-indigo-400"></i> Xavfsiz ulanmoqda...
        </span>
        
    </div>

    <!-- SCRIPT (Dashboardga avto-o'tish) -->
    <script>
        // 3 sekunddan keyin dashboardga o'tadi
        setTimeout(() => {
            window.location.href = "{% url 'dashboard' %}";
        }, 3000);
    </script>

</body>
</html>
